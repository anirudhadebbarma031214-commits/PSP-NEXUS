name: Build PSP NEXUS for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build PSP NEXUS
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PSP-NEXUS main.py

      - name: Upload PSP NEXUS
        uses: actions/upload-artifact@v4
        with:
          name: PSP-NEXUS-Windows
          path: dist/PSP-NEXUS.exe
          if-no-files-found: error
